<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autoevaluación de Kinesiología — SIM-M</title>
<style>
  :root{ --verde:#16a34a; --verde-osc:#166534; --border:#e2e8f0; --bg:#f8fafc; --muted:#64748b; --rojo:#dc2626; }
  *{box-sizing:border-box}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);margin:0;color:#0f172a;line-height:1.5}
  .topbar{background:linear-gradient(135deg,var(--verde),var(--verde-osc));color:#fff;padding:24px 20px;text-align:center}
  .topbar h1{font-size:19px;margin:0 0 4px;font-weight:800}
  .topbar p{font-size:12.5px;margin:0;opacity:.9}
  .wrap{max-width:560px;margin:0 auto;padding:20px}
  .card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:13px;font-weight:600;color:#334155;margin:14px 0 5px}
  select,textarea,input[type=text]{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;font-size:14px;font-family:inherit}
  textarea{min-height:80px;resize:vertical}
  input[type=range]{width:100%}
  .eva-valor{text-align:center;font-size:26px;font-weight:800;color:var(--verde-osc)}
  button{width:100%;margin-top:18px;padding:13px;border:none;border-radius:8px;background:var(--verde);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  button:hover{background:var(--verde-osc)}
  .exito{display:none;text-align:center;padding:30px 20px}
  .exito.show{display:block}
  .formulario.oculto{display:none}
  .muted{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>

<div class="topbar">
  <h1>🦵 Cómo va tu tratamiento kinésico</h1>
  <p>Consultorio Dr. Luis Alberto Muratori — este formulario le llega directo a tu kinesiólogo/a</p>
</div>

<div class="wrap">
  <div class="card formulario" id="formulario">
    <p id="saludo" class="muted"></p>

    <label>¿Cumpliste con los ejercicios/indicaciones de esta semana?</label>
    <select id="cumplimiento">
      <option value="Completo">Sí, completo</option>
      <option value="Parcial">Parcial — algunos días</option>
      <option value="No pude">No pude cumplir</option>
    </select>

    <label>Dolor actual (0 = sin dolor, 10 = el peor dolor)</label>
    <div class="eva-valor" id="evaValor">5</div>
    <input type="range" id="dolor" min="0" max="10" value="5" oninput="document.getElementById('evaValor').textContent=this.value">

    <label>Comparado con la semana anterior, ¿cómo te sentís?</label>
    <select id="comparacion">
      <option value="Mejor">Mejor</option>
      <option value="Igual">Igual</option>
      <option value="Peor">Peor</option>
    </select>

    <label>Región tratada</label>
    <select id="region">
      <option>Cervical</option><option>Hombro</option><option>Codo</option>
      <option>Muñeca / Mano</option><option>Columna dorsal</option>
      <option>Columna lumbar</option><option>Cadera</option>
      <option>Rodilla</option><option>Tobillo / Pie</option><option>Otra</option>
    </select>

    <label>¿Encontraste alguna dificultad? (opcional)</label>
    <textarea id="dificultades" placeholder="Ej: me costó el ejercicio 3, sentí molestia al subir escaleras..."></textarea>

    <label>¿Querés hacerle una pregunta a tu kinesiólogo/a? (opcional)</label>
    <textarea id="pregunta" placeholder="Escribí tu pregunta acá si tenés alguna..."></textarea>

    <button onclick="enviar()">Enviar a mi kinesiólogo/a</button>
    <p class="muted" id="mensajeError" style="color:var(--rojo)"></p>
  </div>

  <div class="card exito" id="exito">
    <h2 style="color:var(--verde-osc)">✅ ¡Gracias!</h2>
    <p>Tu respuesta ya le llegó a tu kinesiólogo/a. Si hiciste una pregunta, te van a responder por mail.</p>
  </div>
</div>

<script>
// Igual que el resto de los formularios de SIM-M: se activa vía parámetros
// en la URL (?dni=...&nombre=...&region=...), que van en el link del mail.
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwYdoFuU8mQL4YKqufSBQ9AD_yqWEEesLtGzYQjNw2JG1BZIQF7ug80mHB5sLMXhaUpvQ/exec'; // misma URL que usa OCM

const params = new URLSearchParams(window.location.search);
const dni = params.get('dni') || '';
const nombrePaciente = params.get('nombre') || '';
const regionPre = params.get('region') || '';

document.getElementById('saludo').textContent = nombrePaciente
  ? ('Hola ' + nombrePaciente + ', completá esto en un minuto:')
  : 'Completá esto en un minuto:';
if(regionPre){
  const sel = document.getElementById('region');
  for(const opt of sel.options){ if(opt.value===regionPre){ sel.value = regionPre; break; } }
}

function enviar(){
  if(!dni){
    document.getElementById('mensajeError').textContent = 'Falta el DNI en el link — pedile a tu kinesiólogo/a que te reenvíe el link correcto.';
    return;
  }
  const vals = {
    cumplimiento: document.getElementById('cumplimiento').value,
    dolor: Number(document.getElementById('dolor').value),
    comparacion: document.getElementById('comparacion').value,
    dificultades: document.getElementById('dificultades').value.trim()
  };
  const pregunta = document.getElementById('pregunta').value.trim();

  const llamadas = [
    fetch(SHEETS_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action:'evaluacion_submit', dni: dni, paciente: nombrePaciente,
        profesional: 'kinesiologo', region: document.getElementById('region').value, vals: vals
      })
    })
  ];
  if(pregunta){
    llamadas.push(fetch(SHEETS_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'kine_pregunta_submit', dni: dni, paciente: nombrePaciente, pregunta: pregunta })
    }));
  }

  Promise.all(llamadas).then(()=>{
    document.getElementById('formulario').classList.add('oculto');
    document.getElementById('exito').classList.add('show');
  }).catch(()=>{
    document.getElementById('mensajeError').textContent = 'No se pudo enviar — revisá tu conexión e intentá de nuevo.';
  });
}
</script>

</body>
</html>
