<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0b1f3a;--blue:#2563eb;--green:#16a34a;--amber:#d97706;
  --red:#dc2626;--purple:#7c3aed;--teal:#0891b2;
  --border:#e2e8f0;--muted:#64748b;--bg:#f0f4f8;--surface:#fff;
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,.08);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#111;font-size:13px}
.header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.hdr-logo{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.hdr-logo img{width:100%;height:100%;object-fit:cover}
.hdr-info{flex:1}
.hdr-dr{font-family:'Playfair Display',serif;font-size:16px;font-style:italic}
.hdr-sub{font-size:9px;opacity:.65;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.hdr-actions{display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.pac-banner{background:var(--navy);border-bottom:3px solid var(--blue);padding:10px 20px 14px;color:#fff}
.pac-nombre{font-family:'Playfair Display',serif;font-size:18px;font-weight:700}
.pac-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px;font-size:11px;opacity:.8}
.page{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.sec-title span{font-size:15px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-green{background:#dcfce7;color:#166534}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#b91c1c}
.field-row{display:flex;gap:10px;margin-bottom:8px;font-size:12px}
.field-lbl{font-weight:600;color:var(--muted);min-width:110px;flex-shrink:0}
.field-val{color:#1e293b;flex:1}
/* Farmacia selector */
.farm-selector{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.farm-card{flex:1;min-width:200px;border:2px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .2s}
.farm-card.active{border-color:var(--blue);background:#eff6ff}
.farm-card h4{font-size:12px;font-weight:700;margin-bottom:4px;color:var(--navy)}
.farm-card p{font-size:11px;color:var(--muted);margin:2px 0;line-height:1.4}
.farm-detail{background:#f8fafc;border-radius:8px;padding:12px;margin-top:8px;display:none}
.farm-detail.show{display:block}
/* Btn genérico */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;text-decoration:none;transition:all .15s}
.btn-wa{background:#25D366;color:#fff}
.btn-wa:hover{background:#128C7E}
.btn-mail{background:#2563eb;color:#fff}
.btn-mail:hover{background:#1d4ed8}
.btn-turno{background:var(--navy);color:#fff}
.btn-turno:hover{background:#1e3a5f}
.btn-consulta{background:var(--purple);color:#fff;width:100%}
.btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
/* Ejercicios */
.ej-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.ej-n{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:4px}
.ej-d{font-size:12px;color:#475569;line-height:1.5;margin-bottom:6px}
.ej-series{font-size:11px;background:#f1f5f9;border-radius:6px;padding:3px 8px;display:inline-block;margin-right:4px;color:#334155}
.ej-resumen{font-size:11px;color:#64748b;background:#f8fafc;border-left:3px solid var(--blue);padding:6px 10px;border-radius:0 6px 6px 0;margin-top:6px}
.ej-video-btn{background:#fee2e2;color:#b91c1c;border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
/* Evaluación */
.eval-entry{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.eval-entry.friday{border-color:var(--amber);background:#fffbeb}
.pain-scale{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
.pain-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:#f8fafc;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pain-btn.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin:6px 0}
.chk-item{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);cursor:pointer;user-select:none;background:#f8fafc;transition:all .15s}
.chk-item.sel{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;font-weight:600}
.resumen-semanal{background:#fffbeb;border:2px solid var(--amber);border-radius:10px;padding:14px;text-align:center}
/* Directorio */
.dir-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.dir-ico{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#f1f5f9}
.dir-info{flex:1;min-width:0}
.dir-name{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:2px}
.dir-det{font-size:11px;color:var(--muted);line-height:1.6}
.dir-btns{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
/* Calistenia */
.fase-line{display:flex;align-items:center;gap:10px;margin:8px 0}
.fase-ico{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.fase-info{flex:1;font-size:12px;line-height:1.5}
/* Consultas online */
.consulta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.consulta-card{border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.consulta-precio{font-size:20px;font-weight:700;color:var(--navy);margin:6px 0}
.consulta-tipo{font-size:12px;font-weight:600;color:#334155;margin-bottom:4px}
.consulta-det{font-size:11px;color:var(--muted);margin-bottom:10px}
/* Tags centro */
.centro-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;background:rgba(30,79,163,.12);color:var(--navy);margin-left:8px}
/* Print */
@media print{
  .header{position:relative;background:#0b1f3a!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .hdr-actions,.btn,.eval-entry{display:none}
  .eval-entry.show-print{display:block}
  .farm-detail{display:block!important}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}
.loading{text-align:center;color:var(--muted);padding:40px;font-size:13px}
.viernes-banner{background:#fef3c7;border:2px solid var(--amber);border-radius:10px;padding:14px;margin-bottom:14px;text-align:center}
</style>
</head>

async function init(){

  // 2) Si no hay datos locales, intentar la nube

  renderPage();
  verificarViernes();
}

  '</div>';

function renderFormEval(){
  const fecha = new Date().toLocaleDateString('es-AR');
  const hist = getEvalHistory();
  const hoy = hist.find(e=>e.fecha===fecha);

  let html = '<div class="eval-entry" id="eval-hoy">'+
    '<div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:8px">📅 Hoy — '+fecha+'</div>';

  html += '<div style="font-size:11px;font-weight:600;color:#334155;margin-bottom:4px">Intensidad del dolor (0 = sin dolor · 10 = máximo)</div>'+
    '<div class="pain-scale" id="ps-dolor">';
  for(let i=0;i<=10;i++){
    const sel = (hoy&&hoy.dolor===i)||evalSelDolor===i;
    html += '<button class="pain-btn'+(sel?' sel':'')+'" onclick="selDolor('+i+')">'+i+'</button>';
  }
  html += '</div>';

  html += '<div style="font-size:11px;font-weight:600;color:#334155;margin:8px 0 4px">Efecto del medicamento (0 = sin efecto · 10 = alivio completo)</div>'+
    '<div class="pain-scale" id="ps-efecto">';
  for(let i=0;i<=10;i++){
    const sel = (hoy&&hoy.efecto===i)||evalSelEfecto===i;
    html += '<button class="pain-btn'+(sel?' sel':'')+'" onclick="selEfecto('+i+')">'+i+'</button>';
  }
  html += '</div>';

  const adv = ['Gastritis/acidez','Somnolencia','Embotamiento','Mareo','Letargo','Confusión','Disestesias (hormigueos)'];
  html += '<div style="font-size:11px;font-weight:600;color:#334155;margin:8px 0 4px">Efectos adversos</div>'+
    '<div class="chk-grid">';
  adv.forEach((a,i)=>{
    const sel = (hoy&&hoy.adversos&&hoy.adversos.includes(a))||evalSelAdversos.includes(a);
    html += '<div class="chk-item'+(sel?' sel':'')+'" onclick="toggleAdverso(\\\''+a+'\\\')" id="adv-'+i+'">'+a+'</div>';
  });
  html += '</div>';

  html += '<div style="margin-top:8px">'+
    '<label style="font-size:11px;font-weight:600;color:#334155;display:block;margin-bottom:4px">Movilidad y actividades del día</label>'+
    '<textarea id="eval-movilidad" rows="2" placeholder="Ej: pude caminar 15 minutos, me cuesta agacharme..." style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px;font-family:inherit;resize:vertical;">'+(hoy&&hoy.movilidad?hoy.movilidad:'')+'</textarea>'+
  '</div>';

  html += '<button onclick="guardarEval()" style="margin-top:10px;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;width:100%">💾 Guardar evaluación de hoy</button>';

  html += '</div>';

  if(hist.length>1){
    html += '<div style="margin-top:12px">'+
      '<div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px">HISTORIAL RECIENTE</div>';
    hist.slice(-5).reverse().forEach(e=>{
      if(e.fecha===fecha) return;
      html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px">'+
        '<span style="min-width:80px;color:var(--muted)">'+e.fecha+'</span>'+
        (e.dolor!==undefined?'<span class="badge badge-red">Dolor: '+e.dolor+'/10</span>':'')+
        (e.efecto!==undefined?'<span class="badge badge-green">Farm.: '+e.efecto+'/10</span>':'')+
      '</div>';
    });
    html += '</div>';
  }

  return html;
}

function getEvalHistory(){
  try{ return JSON.parse(localStorage.getItem('eval_'+DNI)||'[]'); }catch(_){ return []; }
}

function selDolor(v){ evalSelDolor=v; document.getElementById('eval-card').innerHTML='<div class="sec-title"><span>📊</span> Evaluación semanal</div><div style="font-size:12px;color:var(--muted);margin-bottom:12px">Completá estos datos cada día.</div>'+renderFormEval(); }
function selEfecto(v){ evalSelEfecto=v; document.getElementById('eval-card').innerHTML='<div class="sec-title"><span>📊</span> Evaluación semanal</div><div style="font-size:12px;color:var(--muted);margin-bottom:12px">Completá estos datos cada día.</div>'+renderFormEval(); }
function toggleAdverso(a){
  if(evalSelAdversos.includes(a)) evalSelAdversos=evalSelAdversos.filter(x=>x!==a);
  else evalSelAdversos.push(a);
  document.getElementById('eval-card').innerHTML='<div class="sec-title"><span>📊</span> Evaluación semanal</div><div style="font-size:12px;color:var(--muted);margin-bottom:12px">Completá estos datos cada día.</div>'+renderFormEval();
}

function guardarEval(){
  const fecha = new Date().toLocaleDateString('es-AR');
  const movilidad = document.getElementById('eval-movilidad')?.value||'';
  if(evalSelDolor<0){ alert('Indicá el nivel de dolor de hoy (0-10)'); return; }
  const entry = { fecha, dolor:evalSelDolor, efecto:evalSelEfecto, adversos:[...evalSelAdversos], movilidad };
  const hist = getEvalHistory().filter(e=>e.fecha!==fecha);
  hist.push(entry);
  localStorage.setItem('eval_'+DNI, JSON.stringify(hist));
  // Sync nube
  fetch(SHEETS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'evaluacion_submit',dni:DNI,paciente:(DATOS.paciente?DATOS.paciente.apellido+', '+DATOS.paciente.nombre:''),region:'seguimiento',vals:entry})}).catch(()=>{});
  evalSelDolor=-1; evalSelEfecto=-1; evalSelAdversos=[];
  alert('✅ Evaluación guardada. El resumen del viernes se enviará automáticamente al Dr. Muratori.');
  document.getElementById('eval-card').innerHTML='<div class="sec-title"><span>📊</span> Evaluación semanal</div><div style="font-size:12px;color:var(--muted);margin-bottom:12px">Completá estos datos cada día.</div>'+renderFormEval();
}

function verificarViernes(){
  const hoy = new Date();
  if(hoy.getDay()!==5) return;
  const hist = getEvalHistory();
  const semana = hist.filter(e=>{
    const d = new Date(e.fecha.split('/').reverse().join('-'));
    const diff = (hoy-d)/(1000*60*60*24);
    return diff>=0 && diff<7;
  });
  if(semana.length<1) return;
  const avgDolor = (semana.reduce((a,e)=>a+(e.dolor||0),0)/semana.length).toFixed(1);
  const avgEfecto = (semana.reduce((a,e)=>a+(e.efecto||0),0)/semana.length).toFixed(1);
  const adversosList = [...new Set(semana.flatMap(e=>e.adversos||[]))];
  const nombre = DATOS.paciente?(DATOS.paciente.apellido+', '+DATOS.paciente.nombre):'Paciente';
  const msg = '📊 *Resumen semanal — '+nombre+'*\n'+
    '📅 Semana del '+semana[semana.length-1].fecha+' al '+semana[0].fecha+'\n\n'+
    '🔴 Dolor promedio: '+avgDolor+'/10\n'+
    '💊 Efecto farmacológico promedio: '+avgEfecto+'/10\n'+
    (adversosList.length?'⚠️ Efectos adversos: '+adversosList.join(', ')+'\n':'')+
    '📝 Días registrados: '+semana.length+' de 7\n\n'+
    'Seguimiento IMDCYMT — Dr. Luis Muratori';

  const banner = document.createElement('div');
  banner.className='viernes-banner';
  banner.innerHTML='<div style="font-size:13px;font-weight:600;color:#92400e;margin-bottom:8px">📊 Es viernes — enviá tu resumen semanal al Dr. Muratori</div>'+
    '<div style="font-size:11px;color:#92400e;margin-bottom:10px">Dolor promedio: <strong>'+avgDolor+'/10</strong> · Efecto farmacológico: <strong>'+avgEfecto+'/10</strong> · Días registrados: <strong>'+semana.length+'</strong></div>'+
    '<a class="btn btn-wa" href="https://wa.me/'+DOCTOR_WA+'?text='+encodeURIComponent(msg)+'" target="_blank" style="display:inline-flex">📲 Enviar resumen al Dr. Muratori</a>';
  document.getElementById('page-content').prepend(banner);
}

// ── Solicitud de consulta — formulario en el mismo documento ──────
let TIPO_CONSULTA_ACTIVO = '';
function solicitarConsulta(tipo){
  const tar = DATOS.tarifas || {};
  const t = tar[tipo] || {label:tipo, precio:null};
  TIPO_CONSULTA_ACTIVO = tipo;
  const lbl = document.getElementById('modal-tipo-lbl');
  if(lbl) lbl.textContent = `${{texto:'✍️',video:'📹',virtual:'🩺'}[tipo]} ${t.label}${t.precio?' — $'+Number(t.precio).toLocaleString('es-AR'):''}`;
  const m = document.getElementById('modal-solicitar');
  if(m) m.style.display='block';
  document.getElementById('inp-pregunta')?.focus();
  m?.scrollIntoView({behavior:'smooth',block:'center'});
}

async function enviarSolicitudConsulta(){
  const pregunta = document.getElementById('inp-pregunta')?.value.trim();
  if(!pregunta){ alert('Por favor escribí tu consulta antes de enviar.'); return; }
  const pac = DATOS.paciente || {};
  const tar = (DATOS.tarifas||{})[TIPO_CONSULTA_ACTIVO] || {};
  try{
    await fetch(SHEETS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveConsulta',
        dni:pac.dni||DNI, paciente:(pac.apellido||'')+', '+(pac.nombre||''),
        tipo:TIPO_CONSULTA_ACTIVO, precio:tar.precio||0, pregunta})});
  }catch(_){}
  const nombre = (pac.apellido||'')+', '+(pac.nombre||'');
  const precio = tar.precio?`$${Number(tar.precio).toLocaleString('es-AR')}`:'a convenir';
  const texto = `Hola Dr. Muratori, quiero solicitar una ${tar.label||TIPO_CONSULTA_ACTIVO} (${precio}).\n\nMi consulta:\n"${pregunta}"\n\nSoy ${nombre}. DNI: ${pac.dni||DNI||'—'}.`;
  window.open(`https://wa.me/${DOCTOR_WA}?text=${encodeURIComponent(texto)}`,'_blank');
  const m = document.getElementById('modal-solicitar');
  if(m) m.innerHTML=`<div style="text-align:center;padding:16px"><div style="font-size:24px;margin-bottom:8px">✅</div><div style="font-size:13px;font-weight:600;color:#166534;margin-bottom:6px">¡Solicitud enviada!</div><div style="font-size:12px;color:#475569;line-height:1.6">El Dr. Muratori recibió su consulta por WhatsApp.<br>Le enviará el link de pago a la brevedad.<br>Una vez confirmado el pago, recibirá su respuesta.</div></div>`;
}

// ── ENVÍO POR MAIL (PDF automático al paciente) ──────────────────
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onloadend = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function enviarPDFAlPaciente(){
  if(typeof html2pdf === 'undefined'){
    alert('⚠️ La librería para generar PDF todavía no cargó (puede ser por conexión lenta).\n\nEsperá unos segundos y probá de nuevo.');
    return;
  }
  const p = DATOS.paciente || {};
  if(!p.mail){
    alert('⚠️ Este paciente no tiene un email cargado en el sistema.\n\nCargalo en RIMP (o en OCM al generar el documento) para poder enviarle el PDF por mail.');
    return;
  }

  const btn = document.getElementById('btn-enviar-mail');
  const textoOriginal = btn ? btn.innerHTML : '';
  if(btn){ btn.innerHTML='⏳ Generando PDF...'; btn.style.pointerEvents='none'; btn.style.opacity='.7'; }

  try{
    const contenido = document.getElementById('page-content');
    const nombreArchivo = 'Indicacion_'+(p.apellido||'paciente').replace(/[^a-zA-Z0-9]/g,'_')+'.pdf';

    const pdfBlob = await html2pdf().set({
      margin: 6,
      filename: nombreArchivo,
      image:{type:'jpeg', quality:0.95},
      html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
      pagebreak:{mode:['css','avoid-all']}
    }).from(contenido).outputPdf('blob');

    if(btn) btn.innerHTML='📤 Enviando...';

    const base64 = await blobToBase64(pdfBlob);
    const nombreCompleto = (p.apellido||'')+(p.nombre?', '+p.nombre:'');
    const resumen = 'Adjunto encontrarás tu indicación médica completa: diagnóstico, medicación, plan de ejercicios de rehabilitación y turnos con el Dr. Muratori.';

    const r = await fetch(SHEETS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action:'enviarRecetaPorMail',
        Email: p.mail,
        Nombre_Paciente: nombreCompleto,
        Asunto: 'Tu indicación médica — Dr. Muratori',
        Mini_Resumen: resumen,
        Pdf_Base64: base64,
        Pdf_Nombre: nombreArchivo
      }),
      signal: AbortSignal.timeout(20000)
    });
    const data = await r.json();

    if(data.success){
      if(btn){ btn.innerHTML='✅ Enviado'; setTimeout(()=>{ btn.innerHTML=textoOriginal; btn.style.pointerEvents=''; btn.style.opacity=''; },2500); }
      alert('✅ El documento fue enviado por mail a '+p.mail);
    } else {
      throw new Error(data.error || 'Error desconocido del servidor');
    }
  }catch(err){
    if(btn){ btn.innerHTML=textoOriginal; btn.style.pointerEvents=''; btn.style.opacity=''; }
    alert('❌ No se pudo enviar el mail.\n\n'+(err && err.message ? err.message : err)+'\n\nRevisá la conexión a internet e intentá de nuevo.');
  }
}
